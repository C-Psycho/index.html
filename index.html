<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadfeeder Test Target</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            border: 1px solid #334155;
        }

        h2 {
            margin-bottom: 1.5rem;
            text-align: center;
            color: #38bdf8;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            background-color: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: #0369a1;
        }

        .toggle-link {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .toggle-link a {
            color: #38bdf8;
            text-decoration: none;
            cursor: pointer;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

        /* Dashboard Styles */
        .dashboard {
            display: none;
            max-width: 800px;
            width: 90%;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .logout-btn {
            width: auto;
            padding: 0.5rem 1rem;
            background-color: #ef4444;
        }

        .logout-btn:hover {
            background-color: #dc2626;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .card {
            background-color: #0f172a;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #334155;
            text-align: center;
        }

        .card h3 {
            color: #38bdf8;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .card p {
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Auth Container (Login / Register) -->
    <div class="container" id="auth-container">
        <!-- Login Form -->
        <div id="login-form">
            <h2>تسجيل الدخول</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="login-email" required placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit">دخول</button>
            </form>
            <div class="toggle-link">
                ليس لديك حساب؟ <a onclick="toggleAuth('register')">إنشاء حساب جديد</a>
            </div>
        </div>

        <!-- Register Form -->
        <div id="register-form" style="display: none;">
            <h2>حساب جديد</h2>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="reg-name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="reg-email" required placeholder="user@company.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="reg-password" required placeholder="••••••••">
                </div>
                <button type="submit">تسجيل</button>
            </form>
            <div class="toggle-link">
                لديك حساب بالفعل؟ <a onclick="toggleAuth('login')">تسجيل الدخول</a>
            </div>
        </div>
    </div>

    <!-- Dashboard Container -->
    <div class="container dashboard" id="dashboard-container">
        <div class="dashboard-header">
            <h2>لوحة التحكم (Dashboard)</h2>
            <button class="logout-btn" onclick="handleLogout()">خروج</button>
        </div>
        <p>أهلاً بك، <span id="user-display-name" style="color: #38bdf8;"></span> 👋</p>

        <div class="card-grid">
            <div class="card">
                <h3 id="stat-1">12</h3>
                <p>الزيارات اليومية</p>
            </div>
            <div class="card">
                <h3 id="stat-2">5</h3>
                <p>العملاء المحتملين (Leads)</p>
            </div>
            <div class="card">
                <h3 id="stat-3">Active</h3>
                <p>حالة التتبع (Tracker)</p>
            </div>
        </div>
    </div>

    <script>
        function toggleAuth(view) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            if (view === 'register') {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            } else {
                registerForm.style.display = 'none';
                loginForm.style.display = 'block';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            showDashboard(email.split('@')[0]);
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            showDashboard(name);
        }

        function showDashboard(username) {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('dashboard-container').style.display = 'block';
            document.getElementById('user-display-name').innerText = username;
        }

        function handleLogout() {
            document.getElementById('dashboard-container').style.display = 'none';
            document.getElementById('auth-container').style.display = 'block';
        }
    </script>
</body>
</html>
